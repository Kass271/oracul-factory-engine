openapi: 3.0.3
info:
  title: {{APP_TITLE}} API
  version: 0.1.0
  description: Contract between the Spring Boot backend and the Angular frontend. Both sides are generated from this file.
paths:
  /api/ping:
    get:
      tags: [system]
      operationId: ping
      summary: Liveness probe used by the skeleton page
      responses:
        '200':
          description: The backend is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
components:
  schemas:
    Ping:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
