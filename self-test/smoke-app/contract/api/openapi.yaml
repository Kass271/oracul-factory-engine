openapi: 3.0.3
info:
  title: Smoke Todo API
  version: 0.1.0
paths:
  /api/ping:
    get:
      tags: [system]
      operationId: ping
      responses:
        '200':
          description: The backend is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
  /api/todos:
    get:
      tags: [todos]
      operationId: listTodos
      responses:
        '200':
          description: All todos ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      tags: [todos]
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTodo'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Ping:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Todo:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        done:
          type: boolean
    NewTodo:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
